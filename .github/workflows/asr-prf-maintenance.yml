name: ASR and PRF maintenance

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run maintenance script
        run: |
          python scripts/asr_prf_maintenance.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-maintain ASR and PRF files"
          title: "Auto-maintain ASR and PRF files"
          body: |
            Automated maintenance update for ASR and PRF files.

            This PR was generated automatically by the ASR and PRF maintenance workflow.
          branch: auto-maintain-asr-prf
          base: main
          delete-branch: true
