name: Build Installer (Tauri)

on:
  push:
    branches-ignore: [main]
    paths:
      - "installer/**"
      - ".github/workflows/build-installer-tauri.yml"
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/build-installer-tauri.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    name: Core unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - name: Run core tests
        working-directory: installer
        run: cargo test -p controller-pack-core --verbose

  smoke-build:
    name: Linux smoke build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev
      - name: Frontend install
        working-directory: installer
        run: bun install
      - name: Type-check + build frontend
        working-directory: installer
        run: bun run build
      - name: Rust check (Tauri crate)
        working-directory: installer/src-tauri
        run: cargo check --all-targets

  release-build:
    name: Release build (${{ matrix.platform }})
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'installer-v')
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev
      - name: Frontend install
        working-directory: installer
        run: bun install
      - name: Build + sign + upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: installer
          tagName: ${{ github.event.release.tag_name }}
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true
